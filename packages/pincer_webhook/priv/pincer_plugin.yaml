id: webhook
name: Pincer Webhook
version: "0.1.0"
kind: channel
adapter: "Pincer.Channels.Webhook"
description: "Generic HTTP webhook channel for external integrations"
config_schema:
  token_env:
    type: string
    required: true
    description: "Env var with the webhook authentication token"
  session_mode:
    type: string
    description: "Session scoping: per_sender or fixed"
  default_session_id:
    type: string
    description: "Session ID when session_mode is fixed"
  default_source:
    type: string
    description: "Source label attached to incoming messages"
  port:
    type: integer
    description: "HTTP listen port (default 4000; 0 selects an ephemeral port)"
  bind:
    type: string
    description: "Bind address (default 127.0.0.1; never 0.0.0.0 by default)"
  path:
    type: string
    description: "POST path for deliveries (default /webhook/message; /webhook is an alias)"
  max_body_bytes:
    type: integer
    description: "Maximum accepted request body size in bytes (default 1048576)"
