id: dingtalk
name: Pincer DingTalk
version: "0.1.0"
kind: channel
adapter: "Pincer.Channels.DingTalk"
description: "DingTalk robot channel adapter"
config_schema:
  client_id_env:
    type: string
    required: true
    description: "Env var with the DingTalk client ID (DINGTALK_CLIENT_ID)"
  client_secret_env:
    type: string
    required: true
    description: "Env var with the DingTalk client secret (DINGTALK_CLIENT_SECRET)"
