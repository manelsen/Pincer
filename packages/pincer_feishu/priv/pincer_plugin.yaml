id: feishu
name: Pincer Feishu
version: "0.2.0"
kind: channel
adapter: "Pincer.Channels.Feishu"
description: "Feishu (Lark) channel adapter"
config_schema:
  app_id_env:
    type: string
    required: true
    description: "Env var with the Feishu app ID (FEISHU_APP_ID)"
  app_secret_env:
    type: string
    required: true
    description: "Env var with the Feishu app secret (FEISHU_APP_SECRET)"
  base_url:
    type: string
    required: false
    description: "Feishu or Lark API base URL"
  webhook:
    type: object
    required: false
    description: "Inbound webhook settings: enabled, bind, port, path, encrypt_key_env, verification_token_env"
