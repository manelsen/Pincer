<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Pincer v0.2.0 architecture banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#131c36"/>
      <stop offset="100%" stop-color="#1a1230"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5e62"/>
      <stop offset="50%" stop-color="#ff9966"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="clawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ee5253"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>

  <!-- Top accent bar -->
  <rect x="48" y="32" width="1104" height="3" rx="1.5" fill="url(#accentGrad)" opacity="0.85"/>

  <!-- Left geometric Pincer emblem -->
  <g transform="translate(88, 74)">
    <rect x="0" y="0" width="188" height="188" rx="32" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- BEAM supervision orbit -->
    <circle cx="94" cy="94" r="64" fill="none" stroke="url(#beamGrad)" stroke-width="2" stroke-dasharray="6 6" opacity="0.7"/>
    <circle cx="94" cy="30" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="158" cy="94" r="5" fill="#a855f7" filter="url(#glow)"/>
    <circle cx="94" cy="158" r="5" fill="#ff6b6b" filter="url(#glow)"/>
    <circle cx="30" cy="94" r="5" fill="#38bdf8" filter="url(#glow)"/>

    <!-- Stylized robotic pincer claw -->
    <path d="M94 134 L76 116 C56 96 56 62 78 48 L88 64 C76 74 76 92 88 104 L94 110 Z" fill="url(#clawGrad)"/>
    <path d="M94 134 L112 116 C132 96 132 62 110 48 L100 64 C112 74 112 92 100 104 L94 110 Z" fill="url(#clawGrad)"/>
    <circle cx="94" cy="90" r="10" fill="#e2e8f0"/>
    <circle cx="94" cy="90" r="5" fill="#38bdf8"/>
  </g>

  <!-- Title and subtitle -->
  <text x="316" y="132" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#f8fafc">Pincer</text>
  <rect x="536" y="96" width="88" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="580" y="117" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700" fill="#38bdf8">v0.2.0</text>

  <text x="316" y="176" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#cbd5e1">Persistent AI agents on the BEAM: OTP supervision, hexagonal boundaries, embedded SQLite</text>

  <!-- Capability pills -->
  <g transform="translate(316, 208)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">
    <rect x="0" y="0" width="174" height="34" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1"/>
    <text x="87" y="22" text-anchor="middle" fill="#93c5fd">Elixir 1.20.5 / OTP 27</text>

    <rect x="188" y="0" width="150" height="34" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="263" y="22" text-anchor="middle" fill="#c4b5fd">25 Hex Packages</text>

    <rect x="352" y="0" width="186" height="34" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
    <text x="445" y="22" text-anchor="middle" fill="#86efac">SQLite3 + FTS5 + vec0</text>

    <rect x="552" y="0" width="174" height="34" rx="8" fill="#3b0764" stroke="#d946ef" stroke-width="1"/>
    <text x="639" y="22" text-anchor="middle" fill="#f0abfc">19 Tools + MCP</text>
  </g>

  <text x="316" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#94a3b8">9 Channels  &#x2022;  14 LLM Provider Packages  &#x2022;  Boundary 0.12 Strict  &#x2022;  Local / bwrap / Docker / SSH Sandboxes</text>
</svg>
