<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 396" width="1100" height="396" role="img" aria-label="Pincer BEAM OTP supervision tree">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1100" height="396" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

  <text x="32" y="38" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f1f5f9">BEAM / OTP Supervision Tree</text>
  <text x="1068" y="38" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#64748b">lib/pincer/application.ex | strategy: :one_for_one</text>

  <!-- Root Supervisor -->
  <rect x="270" y="58" width="560" height="56" rx="10" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="550" y="81" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="15" font-weight="700" fill="#c4b5fd">Pincer.Supervisor (one_for_one)</text>
  <text x="550" y="102" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12.5" fill="#cbd5e1">Isolates failures by subsystem so one crashed turn never affects other users</text>

  <!-- Orthogonal Tree Bus -->
  <path d="M 550 114 L 550 134" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M 153 134 L 947 134" fill="none" stroke="#64748b" stroke-width="2"/>
  <line x1="153" y1="134" x2="153" y2="152" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="418" y1="134" x2="418" y2="152" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="683" y1="134" x2="683" y2="152" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="947" y1="134" x2="947" y2="152" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pillar 1: State & Storage -->
  <rect x="32" y="158" width="242" height="214" rx="10" fill="url(#cardBg)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="52" y="186" font-family="ui-sans-serif, sans-serif" font-size="15" font-weight="700" fill="#4ade80">1. State &amp; Storage</text>
  <text x="52" y="208" font-family="ui-monospace, monospace" font-size="11.5" fill="#cbd5e1">boots first, outlives turns</text>

  <text x="52" y="240" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">ETSTableHeir</text>
  <text x="52" y="257" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#94a3b8">Preserves hot ETS tables</text>

  <text x="52" y="284" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Pincer.Infra.SQLite</text>
  <text x="52" y="301" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#94a3b8">FTS5 + sqlite-vec engine</text>

  <text x="52" y="328" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">PubSub, Finch &amp; PromEx</text>
  <text x="52" y="345" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#94a3b8">Events, HTTP pools, telemetry</text>

  <!-- Pillar 2: Agent Workers -->
  <rect x="297" y="158" width="242" height="214" rx="10" fill="url(#cardBg)" stroke="#a855f7" stroke-width="1.5"/>
  <text x="317" y="186" font-family="ui-sans-serif, sans-serif" font-size="15" font-weight="700" fill="#c084fc">2. Agent Workers</text>
  <text x="317" y="208" font-family="ui-monospace, monospace" font-size="11.5" fill="#cbd5e1">Horde distributed registries</text>

  <text x="317" y="240" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Session.Supervisor</text>
  <text x="317" y="257" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#94a3b8">One GenServer per user</text>

  <text x="317" y="284" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Project.Supervisor</text>
  <text x="317" y="301" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#94a3b8">Board state and recovery</text>

  <text x="317" y="328" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Introspection.Kernel</text>
  <text x="317" y="345" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#94a3b8">Reflection and sub-agents</text>

  <!-- Pillar 3: Safety & MCP -->
  <rect x="562" y="158" width="242" height="214" rx="10" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="582" y="186" font-family="ui-sans-serif, sans-serif" font-size="15" font-weight="700" fill="#fbbf24">3. Safety &amp; MCP</text>
  <text x="582" y="208" font-family="ui-monospace, monospace" font-size="11.5" fill="#cbd5e1">contains external I/O</text>

  <text x="582" y="240" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">MCP.Supervisor</text>
  <text x="582" y="257" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#94a3b8">External stdio &amp; HTTP tools</text>

  <text x="582" y="284" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">CircuitBreaker</text>
  <text x="582" y="301" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#94a3b8">Shields flaky LLM providers</text>

  <text x="582" y="328" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">RateLimiter &amp; Pairing</text>
  <text x="582" y="345" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#94a3b8">Quotas, DM auth, and hooks</text>

  <!-- Pillar 4: Ingress & Timers -->
  <rect x="826" y="158" width="242" height="214" rx="10" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="846" y="186" font-family="ui-sans-serif, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">4. Ingress &amp; Timers</text>
  <text x="846" y="208" font-family="ui-monospace, monospace" font-size="11.5" fill="#cbd5e1">starts after core is ready</text>

  <text x="846" y="240" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Channels.Supervisor</text>
  <text x="846" y="257" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#94a3b8">9 chat adapter trees</text>

  <text x="846" y="284" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Cron &amp; TimerServer</text>
  <text x="846" y="301" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#94a3b8">Scheduled and delayed jobs</text>

  <text x="846" y="328" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Heartbeat &amp; Bandit</text>
  <text x="846" y="345" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#94a3b8">Proactive wakes and /health</text>
</svg>
