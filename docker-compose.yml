services:
  pincer-server:
    container_name: pincer-server
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${UID:-1000}
        APP_GID: ${GID:-1000}
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
      MIX_ENV: prod
      # bwrap cannot create a nested user namespace under Docker's default
      # AppArmor/seccomp profile. Use the OS transport in the container; the
      # bwrap transport remains available for bare-metal runs.
      PINCER_SANDBOX_TRANSPORT: os
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./.env:/app/.env:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./sessions:/app/sessions
      - ./memory:/app/memory
      - ./workspaces:/app/workspaces
