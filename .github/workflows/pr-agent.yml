name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

# A new push supersedes the review still running for the previous one.
concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr_agent_job:
    # Skip events raised by bots (including PR-Agent itself). Comment commands
    # spend the OpenRouter key, so only PR comments from the owner, members and
    # collaborators run them (in this personal repo, collaborators can push).
    # Fork PRs get no secrets, so they are skipped rather than failing.
    if: >-
      ${{ github.event.sender.type != 'Bot' && (
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository) || (
          github.event.issue.pull_request &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        )
      ) }}
    runs-on: ubuntu-latest
    # A hung run would otherwise hold a runner for six hours. Measured on
    # supernova#55 with the settings below: review 39 s; suggestions 4 min 17 s
    # on the primary (which ran out) plus 65 s on the fallback. Even four
    # calls of that length fit well inside 45 min.
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: PR Agent action step
        # v0.50.0, pinned by commit.
        uses: the-pr-agent/pr-agent@e673a02076ce09a4726c3d0c3cc85780e59ca52b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_KEY }}
          config.model: "openrouter/deepseek/deepseek-v4.1-flash-1017"
          config.fallback_models: '["openrouter/deepseek/deepseek-v4.1-flash"]'
          # Not in PR-Agent's built-in token table. Both models above, primary
          # and fallback, take 1048576 (OpenRouter /api/v1/models,
          # context_length), and 1000000 keeps a margin.
          # Both caps are needed: max_model_tokens clamps every model (default
          # 32k). The output cap below comes out of this window, so the window
          # must hold the prompt plus 128k.
          config.custom_model_max_tokens: "1000000"
          config.max_model_tokens: "1000000"
          # The model reasons before answering; with the provider's default
          # output cap it spent the whole budget thinking and returned nothing.
          # With effort at max, leave room: OpenRouter allows 393k for both
          # models. It is taken from the window above: 1M - 128k leaves ~870k
          # for the prompt.
          config.max_output_tokens: "128000"
          # Effort "max" (sent as xhigh) let the model think until the cap and
          # answer nothing (finish_reason: length), even on a 7k-token diff.
          # A thinking budget instead: deep, but 32k always left for the answer.
          # It takes precedence over the effort below; the run log confirms it:
          # "Using openrouter.reasoning_max_tokens over config.reasoning_effort".
          openrouter.reasoning_max_tokens: "96000"
          # "max" is a valid value in v0.50.0 (ReasoningEffort enum: none,
          # minimal, low, medium, high, xhigh, max), sent to OpenRouter as xhigh.
          config.reasoning_effort: "max"
          # Full names, as in config.model. PR-Agent also matches the bare
          # name as a suffix, but the full form needs no knowing that.
          config.additional_reasoning_effort_models: '["openrouter/deepseek/deepseek-v4.1-flash-1017", "openrouter/deepseek/deepseek-v4.1-flash"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
