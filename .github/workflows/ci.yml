name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.5"
          otp-version: "27.2"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-otp27-elixir1.20-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-otp27-elixir1.20-

      - name: Install dependencies
        run: |
          mix deps.get
          # telegex uses Plug.Router but keeps plug optional; build it first.
          mix deps.compile plug

      - name: Build sqlite-vec extension
        run: ./scripts/build_sqlite_vec.sh

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run strict doctor and security audit posture gates
        env:
          OPENROUTER_API_KEY: ci-posture-check
        run: |
          mix pincer.doctor --strict --config test/fixtures/ci_posture/config.yaml
          mix pincer.security_audit --strict --config test/fixtures/ci_posture/config.yaml

      - name: Run QA gate (format + compile + test)
        run: mix qa

  sqlite-smoke:
    name: Zero-Infra SQLite Smoke & Posture Gate
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test
      PINCER_STORAGE: sqlite
      PINCER_SQLITE_PATH: tmp/ci_smoke.db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.5"
          otp-version: "27.2"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-sqlite-otp27-elixir1.20-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-sqlite-otp27-elixir1.20-
            ${{ runner.os }}-mix-otp27-elixir1.20-

      - name: Install dependencies
        run: |
          mix deps.get
          # telegex uses Plug.Router but keeps plug optional; build it first.
          mix deps.compile plug

      - name: Build sqlite-vec extension
        run: ./scripts/build_sqlite_vec.sh

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run strict doctor and security audit posture gates (no Postgres)
        env:
          OPENROUTER_API_KEY: ci-posture-check
        run: |
          mix pincer.doctor --strict --config test/fixtures/ci_posture/config.yaml
          mix pincer.security_audit --strict --config test/fixtures/ci_posture/config.yaml

      - name: Run Postgres-free SQLite E2E boot smoke test
        run: |
          mix test --warnings-as-errors \
            test/pincer/e2e/zero_infra_sqlite_boot_e2e_test.exs \
            test/pincer/e2e/introspection_skills_e2e_test.exs \
            test/pincer/e2e/ci_posture_fixture_test.exs

  whatsapp:
    name: WhatsApp Channel Tests
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test
      PINCER_WHATSAPP: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.5"
          otp-version: "27.2"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-whatsapp-otp27-elixir1.20-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-whatsapp-otp27-elixir1.20-

      - name: Install dependencies
        run: |
          mix deps.get
          # telegex uses Plug.Router but keeps plug optional; build it first.
          mix deps.compile plug

      - name: Build sqlite-vec extension
        run: ./scripts/build_sqlite_vec.sh

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run WhatsApp tests
        run: mix test --warnings-as-errors test/pincer/channels/whatsapp_test.exs test/pincer/channels/whatsapp_session_test.exs test/pincer/channels/whatsapp_bridge_test.exs

  docker-sandbox-e2e:
    name: Opt-in Real Docker Sandbox E2E
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    env:
      MIX_ENV: test
      PINCER_STORAGE: sqlite
      PINCER_SQLITE_PATH: tmp/ci_docker_e2e.db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.5"
          otp-version: "27.2"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-sqlite-otp27-elixir1.20-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-sqlite-otp27-elixir1.20-
            ${{ runner.os }}-mix-otp27-elixir1.20-

      - name: Pull alpine:3.20 sandbox image
        run: docker pull alpine:3.20

      - name: Install dependencies
        run: |
          mix deps.get
          # telegex uses Plug.Router but keeps plug optional; build it first.
          mix deps.compile plug

      - name: Build sqlite-vec extension
        run: ./scripts/build_sqlite_vec.sh

      - name: Run Docker Sandbox E2E tests
        run: mix test --warnings-as-errors --only docker
