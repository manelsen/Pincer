id: slack
name: Pincer Slack
version: "0.1.0"
kind: channel
adapter: "Pincer.Channels.Slack"
description: "Slack channel adapter via Socket Mode"
config_schema:
  token_env:
    type: string
    required: true
    description: "Env var with the Slack bot token (xoxb-...)"
  app_token_env:
    type: string
    required: true
    description: "Env var with the Slack app-level token (xapp-...) for Socket Mode"
